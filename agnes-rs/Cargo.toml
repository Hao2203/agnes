[workspace]
resolver = "3"
members = [
    "core",
    "util",
    "io",
    "record",
    "transport-reqwest",
    "llm-openai",
    "session-file",
    "agent",
    "cli",
    "ecs",
    "plugin-http",
    "plugin-openai",
    "plugin-async",
    "plugin-session",
    "plugin-session-file",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
agnes-core = { path = "core" }
agnes-util = { path = "util" }
agnes-io = { path = "io" }
agnes-record = { path = "record" }
agnes-transport-reqwest = { path = "transport-reqwest" }
agnes-llm-openai = { path = "llm-openai" }
agnes-session-file = { path = "session-file" }
agnes-agent = { path = "agent" }
agnes-ecs = { path = "ecs" }
agnes-plugin-http = { path = "plugin-http" }
agnes-plugin-openai = { path = "plugin-openai" }
agnes-plugin-async = { path = "plugin-async" }
agnes-plugin-session = { path = "plugin-session" }
agnes-plugin-session-file = { path = "plugin-session-file" }
async-channel = "2"
async-executor = "1"
async-trait = "0.1"
event-listener = "5"
log = "0.4"
ureq = "2"
futures-lite = "2"
cold-string = "0.5"
secrecy = "0.10"
url = "2"
http = "1"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
jiff = { version = "0.2", features = ["serde"] }
reqwest = { version = "0.13.5" }
tokio = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
too_many_arguments = "warn"
wildcard_imports = "warn"
dbg_macro = "deny"
todo = "warn"
unimplemented = "deny"
