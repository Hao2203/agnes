[workspace]
resolver = "3"
members = [
    "agnes/core",
    "agnes/util",
    "agnes/ports",
    "agnes/transport-reqwest",
    "agnes/llm-openai",
    "agnes/agent",
    "agnes/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
agnes-core = { path = "agnes/core" }
agnes-util = { path = "agnes/util" }
agnes-ports = { path = "agnes/ports" }
agnes-transport-reqwest = { path = "agnes/transport-reqwest" }
agnes-llm-openai = { path = "agnes/llm-openai" }
agnes-agent = { path = "agnes/agent" }
async-trait = "0.1"
secrecy = "0.10"
url = "2"
http = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = "0.2"
reqwest = { version = "0.13.5" }
tokio = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
